            --border: #713f12;

        :root[data-theme="crimson-rogue"] {

            --bg-header: #450a0a;
            --bg-sidebar: #2b0909;
            --bg-chat: #140303;

            --bg-msg-in: #3f0e0e;
            --bg-input: #5c1414;
            --text-primary: #fecaca;
            --text-secondary: #f87171;
            --accent: #ef4444;
            --border: #7f1d1d;
            --wallpaper: opacity(0.15) hue-rotate(340deg);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        .bg-app-header { background-color: var(--bg-header); }
        .bg-app-sidebar { background-color: var(--bg-sidebar); }
        .bg-app-chat { background-color: var(--bg-chat); }
        .bg-msg-out { background-color: var(--bg-msg-out); }
        .bg-msg-in { background-color: var(--bg-msg-in); }
        .bg-app-input { background-color: var(--bg-input); }
        .border-app { border-color: var(--border); }
        .text-app-muted { color: var(--text-secondary); }
        .text-accent { color: var(--accent); }

        /* WhatsApp Doodle Background Pattern */
        .chat-wallpaper {
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.4' fill-rule='evenodd'%3E%3Cpath d='M0 0h40v40H0V0zm40 40h40v40H40V40zm0-40h40v40H40V0zM0 40h40v40H0V40z'/%3E%3C/g%3E%3C/svg%3E");
            filter: var(--wallpaper);
        }

        /* Message tail styles */
        .msg-tail-out::after {
            content: '';
            position: absolute;
            top: 0;
            right: -8px;
            width: 0;
            height: 0;
            border-top: 10px solid var(--bg-msg-out);
            border-right: 8px solid transparent;
        }

        .msg-tail-in::before {
            content: '';
            position: absolute;
            top: 0;
            left: -8px;
            width: 0;
            height: 0;
            border-top: 10px solid var(--bg-msg-in);
            border-left: 8px solid transparent;
        }

        /* Pulse animation for voice typing */
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
        .mic-recording {
            animation: pulse-red 1.5s infinite;
            background-color: #ef4444 !important;
            color: white !important;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let firestoreConnected = false;

        // Web Audio Synthesizer for notifications
        function playSoundEffect(type) {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'send') {
                    // Short soft pop
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'receive') {
                    // Dual WhatsApp tone chime
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08); // A5
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) {
                console.log('Audio playback prevented or unsupported');
            }
        }

        // Autofill Role Helper
        window.autofillRole = function(roleKey, pass) {
            document.getElementById('roleSelect').value = roleKey;
            document.getElementById('passwordInput').value = pass;
            document.getElementById('loginError').classList.add('hidden');
        };

        // Handle Login Submission
        window.handleLogin = function(e) {
            e.preventDefault();
            const roleKey = document.getElementById('roleSelect').value;
            const pass = document.getElementById('passwordInput').value.trim();
            const errDiv = document.getElementById('loginError');

            if (!roleKey) {
                errDiv.textContent = 'Please select a role first!';
                errDiv.classList.remove('hidden');
                return;
            }

            const targetRole = ROLES_DATA[roleKey];
            if (pass !== targetRole.pass) {
                errDiv.textContent = `Incorrect password for ${targetRole.name}! (Password is ${targetRole.pass})`;
                errDiv.classList.remove('hidden');
                return;
            }

            // Save user state
            currentUser = {
                role: roleKey,
                name: targetRole.name,
                badge: targetRole.badge,
                color: targetRole.color,
                badgeClass: targetRole.class
            };
            localStorage.setItem('whatsapp_spy_logged_user', JSON.stringify(currentUser));

            initLoggedInUser();
        };

        // Initialize user after login
        function initLoggedInUser() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');

            // Render Header profile
            document.getElementById('userDisplayName').textContent = currentUser.name;
            document.getElementById('userAvatar').textContent = currentUser.name.charAt(0);
            document.getElementById('userAvatar').style.backgroundColor = currentUser.color;
            const badgeEl = document.getElementById('userBadge');
            badgeEl.textContent = currentUser.badge;
            badgeEl.style.backgroundColor = currentUser.color;

            renderChannelsList();
            setActiveChannel('main');

            // Connect Firebase Realtime listener
            setupFirebaseSync();
        }

        // Logout / Switch Role
        window.logout = function() {
            localStorage.removeItem('whatsapp_spy_logged_user');
            currentUser = null;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('passwordInput').value = '';
        };

        // Setup Firebase Firestore Sync
        async function setupFirebaseSync() {
            try {
                // Perform auth before queries according to Rule 3
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Path Rule 1: /artifacts/{appId}/public/data/messages
                const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');

                // Firestore Listener without complex queries (Rule 2)
                onSnapshot(messagesCol, (snapshot) => {
                    firestoreConnected = true;
                    document.getElementById('syncStatusBanner').classList.remove('hidden');

                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    // Sort in memory by createdAt
                    docs.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));

                    // Check for new incoming messages from other devices
                    if (docs.length > allMessages.length && allMessages.length > 0) {
                        const latest = docs[docs.length - 1];
                        if (latest.deviceId !== deviceId) {
                            playSoundEffect('receive');
                        }
                    }

                    allMessages = docs;
                    renderMessages();
                    renderChannelsList();
                }, (error) => {
                    console.warn("Firestore error fallback:", error);
                    setupLocalBroadcastSync();
                });
            } catch (err) {
                console.warn("Firebase Auth / Connection error fallback:", err);
                setupLocalBroadcastSync();
            }
        }

        // Local Fallback Broadcast Channel (if network or firebase blocked)
        function setupLocalBroadcastSync() {
            document.getElementById('syncStatusBanner').innerHTML = `
                <span class="flex items-center gap-1.5 font-medium text-amber-400">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                    Local Multi-Tab Sync Active
                </span>
                <i class="fa-solid fa-wifi-slash"></i>
            `;

            const bc = new BroadcastChannel('whatsapp_spy_channel');
            bc.onmessage = (event) => {
                if (event.data && event.data.type === 'NEW_MSG') {
                    allMessages.push(event.data.msg);
                    playSoundEffect('receive');
                    renderMessages();
                    renderChannelsList();
                }
            };
            window.localBroadcastChannel = bc;
        }

        // Render Channels in Sidebar
        function renderChannelsList(filterQuery = '') {
            const container = document.getElementById('channelList');
            container.innerHTML = '';

            CHANNELS.forEach(ch => {
                if (filterQuery && !ch.name.toLowerCase().includes(filterQuery.toLowerCase())) return;

                // Find last message for channel
                const channelMsgs = allMessages.filter(m => m.channel === ch.id);
                const lastMsg = channelMsgs[channelMsgs.length - 1];
                const isActive = ch.id === currentChannel;

                const item = document.createElement('div');
                item.className = `p-3.5 flex items-center justify-between cursor-pointer hover:bg-white/5 transition border-b border-app/40 ${isActive ? 'bg-white/10' : ''}`;
                item.onclick = () => setActiveChannel(ch.id);

                let timeStr = '';
                let lastText = ch.desc;
                if (lastMsg) {
                    const d = new Date(lastMsg.createdAt);
                    timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    lastText = `${lastMsg.senderName}: ${lastMsg.text}`;
                }

                item.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0 flex-1">
                        <div class="w-11 h-11 rounded-full flex items-center justify-center text-xl shadow flex-shrink-0" style="background-color: ${ch.color}20; border: 1px solid ${ch.color}40;">
                            ${ch.icon}
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center justify-between">
                                <h4 class="font-semibold text-sm truncate">${ch.name}</h4>
                                <span class="text-[10px] text-app-muted flex-shrink-0 ml-1">${timeStr}</span>
                            </div>
                            <p class="text-xs text-app-muted truncate mt-0.5">${escapeHTML(lastText)}</p>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Switch Active Chat Channel
        window.setActiveChannel = function(channelId) {
            currentChannel = channelId;
            const ch = CHANNELS.find(c => c.id === channelId);

            document.getElementById('activeChatTitle').textContent = ch.name;
            document.getElementById('activeChatSubtitle').textContent = ch.desc;
            document.getElementById('activeChatAvatar').textContent = ch.icon;
            document.getElementById('activeChatAvatar').style.backgroundColor = ch.color;

            // On Mobile: hide sidebar, show chat panel
            document.getElementById('sidebarPanel').classList.add('hidden', 'md:flex');
            document.getElementById('chatPanel').classList.remove('hidden');
            document.getElementById('chatPanel').classList.add('flex');

            renderChannelsList();
            renderMessages();
        };

        window.showSidebarMobile = function() {
            document.getElementById('sidebarPanel').classList.remove('hidden');
            document.getElementById('chatPanel').classList.add('hidden');
            document.getElementById('chatPanel').classList.remove('flex');
        };

        // Render Chat Messages
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const currentMsgs = allMessages.filter(m => m.channel === currentChannel);

            if (currentMsgs.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-6 text-app-muted opacity-80">
                        <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center text-3xl mb-3">
                            ??
                        </div>
                        <p class="text-sm font-semibold">End-to-End Game Encryption</p>
                        <p class="text-xs max-w-xs mt-1">Messages sent here are visible in real-time to all connected devices on this channel.</p>
                    </div>
                `;
                return;
            }

            let lastDate = '';

            currentMsgs.forEach((msg) => {
                const msgDate = new Date(msg.createdAt).toLocaleDateString();
                if (msgDate !== lastDate) {
                    lastDate = msgDate;
                    const dateDivider = document.createElement('div');
                    dateDivider.className = 'text-center my-3';
                    dateDivider.innerHTML = `
                        <span class="text-[10px] uppercase font-semibold px-3 py-1 rounded-full bg-app-header text-app-muted border border-app shadow-sm">
                            ${msgDate === new Date().toLocaleDateString() ? 'Today' : msgDate}
                        </span>
                    `;
                    container.appendChild(dateDivider);
                }

                const isMe = msg.senderRole === currentUser.role || msg.deviceId === deviceId;
                const msgTime = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-2.5`;

                const roleColor = ROLES_DATA[msg.senderRole]?.color || '#00a884';

                msgDiv.innerHTML = `
                    <div class="relative max-w-[82%] sm:max-w-[70%] px-3.5 py-2 rounded-2xl text-xs shadow-md ${isMe ? 'bg-msg-out rounded-tr-none msg-tail-out' : 'bg-msg-in rounded-tl-none msg-tail-in'}">
                        ${!isMe ? `
                            <div class="font-bold text-[11px] mb-1 flex items-center gap-1.5" style="color: ${roleColor};">
                                <span>${escapeHTML(msg.senderName)}</span>
                                <span class="text-[9px] px-1.5 py-0.2 rounded-full text-white font-semibold" style="background-color: ${roleColor};">
                                    ${msg.senderRole.toUpperCase()}
                                </span>
                            </div>
                        ` : ''}
                        <div class="text-sm break-words leading-relaxed">${escapeHTML(msg.text)}</div>
                        <div class="text-[9px] text-app-muted text-right mt-1 flex items-center justify-end gap-1 opacity-80">
                            <span>${msgTime}</span>
                            ${isMe ? '<i class="fa-solid fa-check-double text-emerald-400"></i>' : ''}
                        </div>
                    </div>
                `;
                container.appendChild(msgDiv);
            });

            // Auto scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        // Send Message Handler
        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const newMsg = {
                text: text,
                channel: currentChannel,
                senderRole: currentUser.role,
                senderName: currentUser.name,
                senderColor: currentUser.color,
                deviceId: deviceId,
                createdAt: new Date().toISOString()
            };

            input.value = '';
            playSoundEffect('send');

            if (firestoreConnected) {
                try {
                    const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                    await addDoc(messagesCol, newMsg);
                } catch (e) {
                    console.error("Error adding message:", e);
                    allMessages.push(newMsg);
                    renderMessages();
                }
            } else {
                allMessages.push(newMsg);
                renderMessages();
                if (window.localBroadcastChannel) {
                    window.localBroadcastChannel.postMessage({ type: 'NEW_MSG', msg: newMsg });
                }
            }
        };

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        };

        // Speech-to-Text Voice Recording
        window.toggleVoiceInput = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('micBtn');

            if (!SpeechRecognition) {
                alert('Speech Recognition is not supported on your mobile browser. Please type manually.');
                return;
            }

            if (isRecordingVoice) {
                if (speechRecognitionObj) speechRecognitionObj.stop();
                isRecordingVoice = false;
                micBtn.classList.remove('mic-recording');
                return;
            }

            try {
                speechRecognitionObj = new SpeechRecognition();
                speechRecognitionObj.continuous = false;
                speechRecognitionObj.interimResults = true;
                speechRecognitionObj.lang = 'en-US';

                speechRecognitionObj.onstart = function() {
                    isRecordingVoice = true;
                    micBtn.classList.add('mic-recording');
                };

                speechRecognitionObj.onresult = function(event) {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    document.getElementById('messageInput').value = transcript;
                };

                speechRecognitionObj.onerror = function() {
                    isRecordingVoice = false;
                    micBtn.classList.remove('mic-recording');
                };

                speechRecognitionObj.onend = function() {
                    isRecordingVoice = false;
                    micBtn.classList.remove('mic-recording');
                };

                speechRecognitionObj.start();
            } catch (err) {
                console.error("Speech recognition error:", err);
                isRecordingVoice = false;
                micBtn.classList.remove('mic-recording');
            }
        };

        // Audio & Theme Modal Helpers
        window.toggleSound = function() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high text-lg"></i>' : '<i class="fa-solid fa-volume-xmark text-lg text-red-400"></i>';
        };

        window.openThemeModal = function() {
            document.getElementById('themeModal').classList.remove('hidden');
        };

        window.closeThemeModal = function() {
            document.getElementById('themeModal').classList.add('hidden');
        };

        window.applyTheme = function(themeId) {
            document.documentElement.setAttribute('data-theme', themeId);
            localStorage.setItem('whatsapp_spy_theme', themeId);
            renderThemeGrid();
            closeThemeModal();
        };

        function renderThemeGrid() {
            const currentTheme = localStorage.getItem('whatsapp_spy_theme') || 'whatsapp-dark';
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';

            THEMES.forEach(t => {
                const active = t.id === currentTheme;
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border cursor-pointer transition flex items-center justify-between ${active ? 'border-emerald-500 bg-emerald-500/10' : 'border-app hover:bg-white/5'}`;
                card.onclick = () => applyTheme(t.id);
                card.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="w-4 h-4 rounded-full border border-white/20" style="background-color: ${t.color}"></span>
                        <span class="text-xs font-semibold">${t.name}</span>
                    </div>
                    ${active ? '<i class="fa-solid fa-circle-check text-emerald-400 text-xs"></i>' : ''}
                `;
                grid.appendChild(card);
            });
        }

        window.clearCurrentChat = function() {
            allMessages = allMessages.filter(m => m.channel !== currentChannel);
            renderMessages();
            renderChannelsList();
        };

        window.filterChats = function() {
            const q = document.getElementById('searchInput').value;
            renderChannelsList(q);
        };

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Initialize Theme & User Auto-login on load
        window.onload = function() {
            const savedTheme = localStorage.getItem('whatsapp_spy_theme') || 'whatsapp-dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            renderThemeGrid();

            const savedUser = localStorage.getItem('whatsapp_spy_logged_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    initLoggedInUser();
                } catch(e) {
                    localStorage.removeItem('whatsapp_spy_logged_user');
                }
            }
        };
    </script>
</body>
</html>
